@keyframes psiPulse {

@keyframes psiShine {
  0%{background-position:-200% 0}

.psi-orbit-2{background:#F97316; box-shadow:0 0 4px #F9731644; display:none}

      if(statutFilter!=='Toutes' && ev.resolution!==statutFilter) return false; 
      // V867 - Filtre par responsable (liste des comptes enregistrés)
      if(responsableFilter!=='Tous'){
        const mitigations = ev.mitigations||[];
        const match = mitigations.some(m=> 
          String(m.responsable_id)===String(responsableFilter) || 
          m.responsable_nom===responsableFilter ||
          m.responsable_email===responsableFilter ||
          (m.responsable_nom||'').toLowerCase().includes(responsableFilter.toLowerCase())
        );
        if(!match) return false;
      } 
      if(search){ 
        const q=search.toLowerCase(); 
        const hay=(ev.probleme+' '+ev.reference+' '+ev.categorie+' '+(ev.mitigations||[]).map(m=>m.description+' '+m.responsable_nom).join(' ')).toLowerCase(); 
        if(hay.indexOf(q)===-1) return false; 
      } 
      return true; 
    }); 
    if(sortBy==='responsable'){
      // V866 - Tri par Responsable (nom du responsable du premier plan, ou tous les responsables concaténés)
      list=list.sort((a,b)=>{
        const aResps=(a.mitigations||[]).map(m=>m.responsable_nom||'').filter(Boolean).join(', ').toLowerCase();
        const bResps=(b.mitigations||[]).map(m=>m.responsable_nom||'').filter(Boolean).join(', ').toLowerCase();
        // Si pas de responsable, mettre à la fin
        if(!aResps && bResps) return 1;
        if(aResps && !bResps) return -1;
        return aResps.localeCompare(bResps, 'fr', {sensitivity:'base'});
      });
    } else if(sortBy==='recent') {
      list=list.sort((a,b)=> b.id - a.id);
    } else if(sortBy==='risk'){ 
      const order={Elevé:0, Moyen:1, Faible:2};

    } else if(sortBy==='prio') {
      list=list.sort((a,b)=> a.priorite - b.priorite);
    }
